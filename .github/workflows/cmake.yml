name: CMake

on:
  push:
    branches: [ "main", "modernisation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    cc: gcc }
          - { os: ubuntu-latest,    cc: clang }
          - { os: ubuntu-24.04-arm, cc: gcc }
          - { os: macos-latest,     cc: clang }
    steps:
    - uses: actions/checkout@v4

    - name: Allow ThreadSanitizer on newer Linux kernels
      # TSan fails with "unexpected memory mapping" when the kernel uses more mmap
      # randomisation bits than it supports.
      if: runner.os == 'Linux'
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Configure (warnings are errors)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

    - name: Build
      run: cmake --build build --parallel 4

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 300

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=ASAN -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined"

    - name: Build
      run: cmake --build build --parallel 4

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 300

  musl:
    name: Alpine (musl libc)
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: apk add --no-cache build-base cmake python3 linux-headers

    - name: Configure (warnings are errors)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

    - name: Build
      run: cmake --build build --parallel 4

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 300
